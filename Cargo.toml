[package]
name = "bb_ai"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.33.1", features = ["chat-completion", "byot", "response-types", "assistant-types"] }
color-eyre = "0.6.5"
colored = "3.1.1"
eyre = "0.6.12"
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[workspace]
members = ["troll_code_review"]

[workspace.dependencies]
colored = "3.1.1"

[dev-dependencies]
dotenvy = "0.15.7"
